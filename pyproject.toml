[project]
name = "embeddinggemma"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faiss-cpu>=1.7.0",
    "numpy>=1.21.0,<2.0",
    "pandas>=1.3.0,<2.0",
    "plotly>=5.0.0",
    "requests>=2.28.0",
    "scikit-learn>=1.0.0",
    "streamlit>=1.28.0",
]

[project.optional-dependencies]
reranker = [
    "sentence-transformers>=3.0.0",
    "torch>=2.0.0",
]

selbstbild = [
    "tree-sitter==0.26.0",
    "tree-sitter-language-pack==1.22.1",
    "igraph==1.0.0",
    "leidenalg==0.12.0",
    "PyYAML>=6",
    "pydantic>=2",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
